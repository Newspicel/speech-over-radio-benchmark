[project]
name = "sorb"
version = "0.1.0"
description = "Speech-over-radio benchmark: denoisers and restoration chains on NFM, AM and SSB speech"
license = "ISC"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "soxr>=0.5",
    "pandas>=2.2",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "pesq>=0.0.4",
    "pystoi>=0.4",
    "onnxruntime>=1.19",
    "jiwer>=3.0",
    "whisper-normalizer>=0.0.10",
    "mlx-whisper>=0.4",
    "silero-vad>=5.1",
    "noisereduce>=3.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "tqdm>=4.66",
]

[project.scripts]
sorb = "sorb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sorb"]

[tool.uv]
package = true
